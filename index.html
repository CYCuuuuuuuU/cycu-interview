<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>中原大學面試經驗查詢系統</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
    
<body>
<div class="container">
    <h1>
        <span>中原大學面試經驗查詢</span>
        <span class="unofficial-badge">非官方</span>
    </h1>
    
    <div class="filter-grid">
        <div class="select-group">
            <label>1. 選擇學院</label>
            <div class="custom-select-wrapper">
                <div class="select-box disabled" id="box-college" onclick="toggleDropdown('college')">
                    <span class="selected-text" id="text-college">載入中...</span>
                    <span class="arrow">▼</span>
                </div>
                <div class="dropdown-options" id="options-college"></div>
            </div>
        </div>

        <div class="select-group">
            <label>2. 選擇系所</label>
            <div class="custom-select-wrapper">
                <div class="select-box disabled" id="box-dept" onclick="toggleDropdown('dept')">
                    <span class="selected-text" id="text-dept">請先選擇學院</span>
                    <span class="arrow">▼</span>
                </div>
                <div class="dropdown-options" id="options-dept"></div>
            </div>
        </div>

        <div class="select-group">
            <label>3. 招生管道</label>
            <div class="custom-select-wrapper">
                <div class="select-box disabled" id="box-path" onclick="toggleDropdown('path')">
                    <span class="selected-text" id="text-path">請先選擇系所</span>
                    <span class="arrow">▼</span>
                </div>
                <div class="dropdown-options" id="options-path"></div>
            </div>
        </div>

        <div class="select-group">
            <label>4. 學年度</label>
            <div class="custom-select-wrapper">
                <div class="select-box disabled" id="box-year" onclick="toggleDropdown('year')">
                    <span class="selected-text" id="text-year">請先選擇管道</span>
                    <span class="arrow">▼</span>
                </div>
                <div class="dropdown-options" id="options-year"></div>
            </div>
        </div>
    </div>

    <div id="result" class="result-card">
        <div class="pagination" id="pag-area" style="display: none;">
            <button class="nav-btn" id="btn-prev" onclick="changePage(-1)">← 上一筆</button>
            <span class="pagination-info" id="pag-text">第 1 / 1 筆</span>
            <button class="nav-btn" id="btn-next" onclick="changePage(1)">下一筆 →</button>
        </div>

        <div class="info-grid">
            <div class="info-item"><span class="info-label">面試形式：</span><span id="res-type"></span></div>
            <div class="info-item"><span class="info-label">考生人數：</span><span id="res-stus"></span></div>
            <div class="info-item"><span class="info-label">考官人數：</span><span id="res-profs"></span></div>
            <div class="info-item"><span class="info-label">考場佈置：</span><span id="res-layout"></span></div>
        </div>

        <div class="item-box">
            <div class="item-title">面試流程與題目</div>
            <div id="res-combined" class="item-content"></div>
        </div>
        <div class="item-box">
            <div class="item-title">給學弟妹的建議</div>
            <div id="res-advice" class="item-content"></div>
        </div>
    </div>

    <div class="share-banner">
        <p>歡迎分享你的面試經驗，幫助更多學弟妹！</p>
        <a href="https://docs.google.com/forms/d/e/1FAIpQLSc2X4-W8Th6FwGBGORvgb7VbovD5sQn1JgkhaJvJfGl0dlG4A/viewform?usp=header" target="_blank" class="share-btn">我要分享</a>
    </div>

    <footer class="footer">
        <p>© <strong>艾斯</strong></p>
    </footer>
</div>

<script src="script.js"></script>
</body>
</html>
